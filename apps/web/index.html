    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('pharmacy-pos-theme');
          var savedSettings = localStorage.getItem('pharmacy-pos-settings');
          var theme = 'dark';
          if (savedSettings) {
            var parsed = JSON.parse(savedSettings);
            if (parsed && parsed.theme) {
              theme = parsed.theme;
            }
          } else if (savedTheme) {
            theme = savedTheme;
          }
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
